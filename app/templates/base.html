<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PracticaFlask{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <div class="nav-brand">
            <a href="{{ url_for('main.index') }}">DEDSEC // LOGS</a>
        </div>
        <div class="nav-links">
            <a href="{{ url_for('main.index') }}">Feed</a>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('main.profile', username=current_user.username) }}">@{{ current_user.username }}</a>
                <a href="{{ url_for('main.new_post') }}">+ New Entry</a>
                <a href="{{ url_for('auth.logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('auth.login') }}">Login</a>
                <a href="{{ url_for('auth.register') }}">Register</a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
